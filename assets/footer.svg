<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="A cat chases a little robot across the page">
  <style>
    .chase { animation: chase 9s linear infinite; }
    @keyframes chase { from { transform: translate(-200px, 92px) } to { transform: translate(1000px, 92px) } }
    .bob { animation: bob .3s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0) } to { transform: translateY(-5px) } }
    .limb { transform-box: fill-box; transform-origin: 50% 0; }
    .a { animation: swing .3s ease-in-out infinite alternate; }
    .b { animation: swing .3s ease-in-out infinite alternate-reverse; }
    @keyframes swing { from { transform: rotate(-30deg) } to { transform: rotate(30deg) } }
    .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: wag .4s ease-in-out infinite alternate; }
    @keyframes wag { from { transform: rotate(-15deg) } to { transform: rotate(15deg) } }
    .sweat { animation: drop .6s ease-in infinite; }
    @keyframes drop { from { opacity: 1; transform: translate(0,0) } to { opacity: 0; transform: translate(-8px,10px) } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; animation-iteration-count: 1 !important; } }
  </style>
  <rect width="900" height="110" rx="14" fill="#0b1020"/>
  <line x1="0" y1="92" x2="900" y2="92" stroke="#4c3f9e" stroke-width="2"/>

  <g class="chase">
    <!-- robot running ahead -->
    <g transform="translate(130 0)">
      <g class="bob">
        <rect class="limb a" x="-11" y="-16" width="8" height="16" rx="4" fill="#7c3aed"/>
        <rect class="limb b" x="3" y="-16" width="8" height="16" rx="4" fill="#6d28d9"/>
        <rect class="limb b" x="-24" y="-42" width="7" height="20" rx="3.5" fill="#7c3aed"/>
        <rect x="-17" y="-46" width="34" height="30" rx="9" fill="#8b5cf6"/>
        <rect class="limb a" x="17" y="-42" width="7" height="20" rx="3.5" fill="#6d28d9"/>
        <rect x="-15" y="-72" width="30" height="25" rx="8" fill="#c4b5fd"/>
        <circle cx="-6" cy="-60" r="4" fill="#0b1020"/><circle cx="6" cy="-60" r="4" fill="#0b1020"/>
        <ellipse cx="0" cy="-52" rx="4" ry="3" fill="#0b1020"/>
        <line x1="0" y1="-72" x2="0" y2="-80" stroke="#c4b5fd" stroke-width="2.5"/>
        <circle cx="0" cy="-82" r="4" fill="#f472b6"/>
        <circle class="sweat" cx="-20" cy="-70" r="2.5" fill="#93c5fd"/>
      </g>
    </g>
    <!-- cat chasing behind -->
    <g class="bob">
      <path class="tail" d="M-30 -18 C-48 -22 -52 -42 -44 -52" stroke="#8b949e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect class="limb a" x="-26" y="-12" width="7" height="12" rx="3.5" fill="#6e7681"/>
      <rect class="limb b" x="-14" y="-12" width="7" height="12" rx="3.5" fill="#8b949e"/>
      <rect class="limb b" x="8" y="-12" width="7" height="12" rx="3.5" fill="#6e7681"/>
      <rect class="limb a" x="20" y="-12" width="7" height="12" rx="3.5" fill="#8b949e"/>
      <ellipse cx="0" cy="-19" rx="30" ry="13" fill="#8b949e"/>
      <path d="M38 -38 L36 -54 L28 -44 Z" fill="#8b949e"/>
      <path d="M16 -44 L10 -56 L6 -40 Z" fill="#8b949e"/>
      <circle cx="24" cy="-30" r="17" fill="#8b949e"/>
      <ellipse cx="25" cy="-26" rx="13" ry="9" fill="#f5d0c5"/>
      <ellipse cx="19" cy="-32" rx="2.5" ry="3.5" fill="#0b1020"/><ellipse cx="31" cy="-32" rx="2.5" ry="3.5" fill="#0b1020"/>
      <path d="M23 -25 L27 -25 L25 -22 Z" fill="#db2777"/>
      <ellipse cx="25" cy="-18" rx="3" ry="2.5" fill="#0b1020"/>
    </g>
  </g>
</svg>
