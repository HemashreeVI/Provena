services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      PROVENA_ENV: production
      PROVENA_LOG_FORMAT: json
      PROVENA_QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
